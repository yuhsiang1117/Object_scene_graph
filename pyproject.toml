[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "osg"
version = "0.1.0"
description = "Real-time object-based hierarchical 3D scene graph for open-vocabulary ObjectNav"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "opencv-python-headless",
    "hydra-core>=1.3",
    "omegaconf",
    "openai>=1.30",
    "imageio",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]
models = ["ultralytics==8.3.*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: requires habitat-sim and HM3D data",
    "gpu: requires CUDA GPU and model weights",
]
