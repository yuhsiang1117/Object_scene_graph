services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=2  
      - OLLAMA_CONTEXT_LENGTH=8192
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nav:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    runtime: nvidia
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    command: ["bash"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HOME=/tmp
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      - ..:/workspace
      - weights-cache:/workspace/data/weights
      # Habitat assets and authored layouts live in the collector checkout.
      # The nav container may read and update both collector trees directly.
      # Its UID/GID matches the host owner, so new files remain host-accessible.
      - ${HABITAT_COLLECTOR_DATA_DIR:-../../habitat-data-collector/data}:/datasets/habitat-data-collector/data:rw
      - ${DUALMAP_AUTHORING_DIR:-../../habitat-data-collector/outputs/dualmap_authoring}:/datasets/habitat-data-collector/outputs/dualmap_authoring:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics]
    ipc: host

volumes:
  ollama-models: {}
  weights-cache: {}
