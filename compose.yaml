services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nav:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - ollama
    stdin_open: true
    tty: true
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      # The repo bind mount already covers ./data (gitignored). If your HM3D
      # data lives outside the repo, add an explicit mount here, e.g.:
      #   - /path/to/hm3d:/workspace/data/scene_datasets/hm3d:ro
      # (note: a mount at that path breaks scripts/download_data.py, which
      # needs to create a symlink there — mount only pre-downloaded data)
      - .:/workspace
      - weights-cache:/workspace/data/weights
      - ./outputs:/workspace/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics]
    ipc: host

volumes:
  ollama-models: {}
  weights-cache: {}
