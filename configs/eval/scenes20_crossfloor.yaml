# The 21 cross-floor episodes of scenes20_ep0to4, for iterating on stair
# behaviour without paying for the 79 single-floor episodes that cannot exercise
# it. Measured on that split: reaching the goal's storey predicts success 5/6,
# and never reaching it predicts failure 15/15 -- so this subset carries the
# whole cross-floor signal.
#
# NOT an A/B split in its own right: numbers here are not comparable to the
# 100-episode headline, only to each other.
split: val
dataset_version: v1
episodes_path: data/datasets/objectnav/hm3d/v1/{split}/{split}.json.gz
num_episodes: -1
max_scene_repeat_episodes: -1
