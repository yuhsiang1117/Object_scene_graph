defaults:
  - base_hm3d

# 20 val scenes x episodes 0-4 = 100 episodes.
#
# GENERATED -- do not hand-edit. Unlike dev50/dev50_mf this is not a sampled A/B
# split: it is the first five episodes of every scene, the set ASCENT is
# reported at 0.70 SR on.
#
# The ids follow habitat's loader, which assigns episode_id = str(i) in FILE
# ORDER within each content file (object_nav_dataset.py). The raw episode_id
# field in the json is "0" for nearly every episode and is NOT what the loader
# exposes -- reading it directly matches only 27 of these 100.
#
# 21 of the 100 need a floor change (start-to-goal height gap > 1.0 m, taken
# from goals_by_category rather than the per-episode `goals` list, which is
# empty in v1). multi_floor and the stair machinery must be ON for this split
# to measure what it is for.
split: val
dataset_version: v1
episodes_path: data/datasets/objectnav/hm3d/v1/{split}/{split}.json.gz
num_episodes: -1
max_scene_repeat_episodes: -1
