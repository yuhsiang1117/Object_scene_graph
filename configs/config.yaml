defaults:
  - base_config
  - agent: default
  - detector: yoloe_small   # 6GB VRAM profile; switch to `yoloe` on >=12GB
  - scene_graph: default
  - exploration: llm_text   # old-algorithm: text-LLM frontier ranking
  - llm: nim                # NVIDIA NIM (needs NVIDIA_API_KEY); override llm=ollama for local
  - verification: "off"     # old-algorithm terminal: viewpoint + bbox stop, no VLM verify
  - eval: hm3d_val_mini
  - _self_

seed: 42
output_dir: outputs/${now:%Y%m%d_%H%M%S}

hydra:
  job:
    chdir: false
