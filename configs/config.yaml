# The default: ASCENT's control flow on ASCENT's served models, sensor-only,
# measured at 63.0% SR / 0.36 SPL on `scenes20_ep0to4` (docs/AB_RESULTS.md S71;
# native ASCENT on the same 100 episodes: 65.0% / 0.36).
#
#   bash scripts/serve_perception.sh          # the five model servers, once
#   python scripts/run_eval.py                # this config, on the 100-episode split
#
# It needs the servers and a local ollama with qwen2.5:7b; the run refuses to
# start if any of them is down. `+experiment=ascentnav` is the same config by
# name. Pre-S71 presets pull `legacy_defaults` to get the old base back.
defaults:
  - base_config
  - agent: s71
  - detector: dfine
  - scene_graph: place365
  - exploration: s71
  - llm: qwen_local
  - verification: s71
  - eval: scenes20_ep0to4
  - s71_defaults
  - _self_

seed: 42
output_dir: outputs/${now:%Y%m%d_%H%M%S}

hydra:
  job:
    chdir: false
