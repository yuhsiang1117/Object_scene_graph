# The default: ASCENT's control flow on ASCENT's served models, sensor-only,
# plus the storey belief and the climb verification of S83 (`agent: s86`).
# On `scenes20_ep0to4` 67/100 against 65/100 without them; held-out
# `scenes20_ep5to9` 60 against 58 (docs/history/AB_RESULTS.md S85, S86).
# Without them it is the S71 arm, `+experiment=ascentnav` (63.0% / 0.36 SPL
# in S71, 65/100 in S83; native ASCENT on the same 100 episodes: 65.0% / 0.36).
#
#   bash scripts/serve_perception.sh          # the five model servers, once
#   python scripts/run_eval.py                # this config, on the 100-episode split
#
# It needs the servers and a local ollama with qwen2.5:7b; the run refuses to
# start if any of them is down. Pre-S71 presets pull `legacy_defaults` to get
# the old base back.
defaults:
  - base_config
  - agent: s86
  - detector: dfine
  - scene_graph: place365
  - exploration: s71
  - llm: qwen_local
  - verification: s71
  - eval: scenes20_ep0to4
  - ros2: stretch3
  - s71_defaults
  - _self_

seed: 42
output_dir: outputs/${now:%Y%m%d_%H%M%S}

hydra:
  job:
    chdir: false
