# @package _global_
#
# THE comparable number, on the full v1 val split -- so the result belongs in
# the same column as ASCENT's published 63% SR rather than needing a footnote.
#
#   bash scripts/serve_perception.sh                              # five servers
#   python scripts/run_eval.py +experiment=final_sensor +profile=report
#
# This is `ascentnav` (S71: the reference's control flow on the reference's
# served models) on every episode. Its counterpart is `ascent_aligned`, the
# same protocol on habitat's ground-truth navmesh; the gap between them is
# what privilege was worth. Quote either number with the profile that produced
# it.

defaults:
  - ascentnav
  - override /eval: hm3d_val_v1_full

eval:
  num_episodes: -1
