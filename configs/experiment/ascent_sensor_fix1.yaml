# are now identical and either reproduces run B.
#
#   python scripts/run_eval.py +experiment=ascent_sensor_fix1 eval=scenes20_ep0to4

defaults:
  - ascent_sensor

agent:
  terminal_requires_detection: false
  pointnav_stop_means_blocked: true
  frontier_reachability_gate: true
