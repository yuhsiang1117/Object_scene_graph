# @package _global_
#
# Ablation of the final arm (`mfv2_osg_mouth_walk`): no VLM. In this arm the VLM's only role is the absence check on arrival
# (`verification.absence_only` keeps the candidate check off), so this removes it all.
# On seed 42 (mfv2_osg_mouth) that was 30 calls in 73 episodes, 28 about false tracks.
#
#   bash scripts/run_mfv2.sh osg_mouth_walk_no_vlm <seed>
defaults:
  - mfv2_osg_mouth_walk
  - _self_

verification:
  absence_use_vlm: false
