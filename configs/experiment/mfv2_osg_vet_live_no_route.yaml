# @package _global_
#
# The final arm (`mfv2_osg_landing_vet_live`) with ONE change: no route climb.
# Paired against osg_landing_vet_live_s<seed>; the same ablation on the earlier
# arm is `mfv2_osg_mouth_walk_no_route`.
#
#   bash scripts/run_mfv2.sh osg_vet_live_no_route <seed>
defaults:
  - mfv2_osg_landing_vet_live
  - _self_

agent:
  climb_route: false
