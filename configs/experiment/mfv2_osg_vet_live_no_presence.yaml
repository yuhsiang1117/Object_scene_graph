# @package _global_
#
# The final arm (`mfv2_osg_landing_vet_live`) with ONE change: no presence filter -- tracks never fade, and the prior / live vetting's "no" becomes a one-time veto rather than a presence reading.
# Paired against osg_landing_vet_live_s<seed>; the same ablation on the earlier
# arm is `mfv2_osg_mouth_walk_no_presence`.
#
#   bash scripts/run_mfv2.sh osg_vet_live_no_presence <seed>
defaults:
  - mfv2_osg_landing_vet_live
  - _self_

scene_graph:
  presence:
    enabled: false
