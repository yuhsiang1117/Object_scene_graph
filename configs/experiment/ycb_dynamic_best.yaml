# @package _global_
#
# The best-scoring configuration on the dynamic YCB benchmark: condition N,
# 0.635 over 96 episodes (in_anchor 0.812, cross_anchor 0.458, SPL 0.319),
# against 0.448 for the previous head of the ladder (K) and 0.458 for the
# previous best (C0). See docs/ARCHITECTURE.md for the full A-N table.
#
# Replication status, which matters more here than the headline: condition M
# (this minus the last flag) was run TWICE and reproduced at 0.615 and 0.604 --
# one episode apart, and within one at every stage of the funnel. N is a single
# run at +2.5 episodes over that pair's mean, which matches what the offline
# analysis predicted for it but has not itself been repeated.
#
#   python scripts/run_eval.py +experiment=ycb_dynamic_best \
#     'ycb.scenes=[00829-QaLdnwvtxbs]' \
#     'ycb.targets=[bowl,tin can,cracker box,red plate,blue plastic pitcher,bleach bottle]' \
#     ycb.map_in=outputs/maps_v5/00829-QaLdnwvtxbs
#
# The prior map is deliberately NOT set here: which snapshot to navigate from is
# the experiment, and a preset that picked one for you would hide it.
#
# Everything below is the K campaign line plus the five flags that separate M
# from it. Each of the five defaults to OFF in `core/config/`, so this preset is
# the only place the winning combination is asserted -- which keeps every
# earlier condition of the ladder reproducible from its own overrides.
defaults:
  - ycb_authored_nav
  - override /verification: nim
  - override /llm: nim

# --- the K line ------------------------------------------------------------
eval:
  attempts: 3          # DualMap's protocol: several navigation attempts per query
  rgb_width: 1280
  rgb_height: 960

detector:
  imgsz: 1280

scene_graph:
  min_det_bbox_px: 1200
  target_bypasses_gates: true
  presence:
    enabled: true
    recall_model_path: outputs/recall/recall_model.json

exploration:
  search_posterior: true
  affinity_llm: true
  search_frontier_weight: 0.3
  search_glance_floor: 0.2

verification:
  absence_only: true   # the VLM as an absence sensor, not a candidate gate
  vlm_model: meta/llama-3.2-11b-vision-instruct
  min_obs: 1
  min_evidence: 0.2
  min_bbox_px: 800
  unreachable_is_absorbing: false
  target_bypasses_bbox_gate: true
  # N: rank candidates by belief, tie-broken on evidence. Multiplying by
  # detector confidence hurts -- a confident false positive is precisely a
  # distant object that really does look like the target.
  rank_candidates_by_presence: true

llm:
  text_model: nvidia/nemotron-3.5-lightning-30b-a3b

# --- what M adds ------------------------------------------------------------
# L: an unreachable candidate is judged at the pose the agent would DRIVE to,
# and the verdict is evidence rather than a permanent blacklist. Six of 00829's
# 36 target poses are off-navmesh with a reachable viewpoint.
agent:
  reachable_via_viewpoint: true

# L: a glance may not retire a surface harder than an inspection does. Measured,
# 64% of the candidate set was being written off per episode, mostly unvisited;
# 0.2 is 1 - search_detect_prob, exactly what one real arrival buys.
# (exploration.search_glance_floor, set below)

# M: the episode's target is admitted on the DETECTOR's terms. The map was
# discarding 33% of the times the detector named the target, and in 11 episodes
# every single naming -- no track, so no candidate, so no approach, so the
# detection never got closer. Five of those eleven were a contradiction:
# detector.class_conf lowers the detector to 0.20 for the four weakest classes
# and min_det_score 0.35 then threw away everything they gained.
