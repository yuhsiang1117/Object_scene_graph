# @package _global_
#
# FULL v1 val, 5 episodes/scene (20 scenes = 100 episodes), best measured config:
#   - Habitat-navmesh navigation (use_habitat_navmesh) + reachability/retreat fixes
#   - sweep exploration (nearest + momentum, info_gain=2), LLM-free
#   - forced-choice VLM verify (verification=nim) -- rejects detector mislabels
#     (e.g. stool->chair) before committing
#   - MULTI-FLOOR: per-floor costmaps, 3D navmesh goals, portal-based cross-floor
#     exploration timed by target-category context (docs/MULTI_FLOOR.md)
#   - TERMINAL CREEP instead of the fixed depth stop: after navmesh arrival,
#     centre the target and walk in until physically blocked
#
# Measured on full v1 (100 episodes):
#   flags off                       SR 40.0  SPL 0.200  single 68.6  multi 24.6  cross  0.0
#   + floors/per-floor maps/3D goal SR 42.0  SPL 0.211  single 68.6  multi 27.7  cross  0.0
#   + category-timed switching      SR 44.0  SPL 0.217  single 71.4  multi 29.2  cross  0.0
#   + frontier cost to free cell    SR 46.0  SPL 0.215  single 71.4  multi 32.3  cross  4.2
#   + looser floor-switch gate      SR 46.0  SPL 0.228  single 68.6  multi 33.8  cross 16.7
#   + terminal creep, no depth stop SR 48.0  SPL 0.234  single 68.6  multi 36.9
#
#   python scripts/run_eval.py +experiment=full_v1_navmesh eval.debug_frames=true
defaults:
  - override /detector: yoloe
  - override /eval: hm3d_val_v1
  - override /verification: nim
  - override /exploration: sweep

agent:
  success_distance: 0.18
  use_habitat_navmesh: true
  # Terminal precision. The fixed depth stop was NOT the cause of near-misses
  # (it produced 28 successes and zero sub-metre misses); every sub-metre miss
  # came from stopping the instant the navmesh reported arrival, up to 0.85 m
  # from the nearest goal view point. Creeping in until blocked converts at
  # 78% vs the depth stop's 55%, and cut near-misses 12 -> 7.
  approach_depth_stop: false
  terminal_creep: true
  # A timeout scores zero whatever the pose; one episode ended 0.05 m from a
  # view point without ever pressing STOP. Stopping 3 steps early is free.
  stop_before_budget: 3
  # Snap navmesh goals at the TARGET's floor, not the agent's own height --
  # without this every cross-floor candidate reads as unreachable.
  navmesh_3d_goals: true

exploration:
  # Rank frontiers by a path cost measured to the free-snapped centroid: the
  # costmap planner often cannot reach an UNKNOWN frontier cell, which collapsed
  # whole selection rounds (select_none 128 -> 7 per 100 episodes). The agent
  # still DRIVES to the frontier cell -- moving the drive goal too costs
  # coverage (single-floor explore-failures 0 -> 3). See MULTI_FLOOR.md.
  frontier_cost_free_cell: true

floor:
  enabled: true
  estimate_only: false
  per_floor_costmap: true
  cross_floor: true
  # floor.stairs stays OFF: the geometric stair detector does not detect
  # staircases (flat tread interiors fragment the region). See MULTI_FLOOR.md.

eval:
  num_episodes: 100
  max_scene_repeat_episodes: 5
