# @package _global_
#
# The final arm with the object layer's depth-point ellipsoids as adopted in
# docs/history/AB_RESULTS.md S82 (variant R2): I6r1 (`mfv2_osg_vet_live_ellipsoid_v2`)
# plus `fuse_report`. Association, presence and refine keep I6r1's ellipsoid;
# the map REPORTS a box fitted to the fused depth points of every associated
# view (the DBSCAN cluster nearest the ellipsoid; the ellipsoid itself until a
# cluster forms). What reads the report: `ObjectLayer.center_of` (every goal,
# approach and stop-gate centre), the scene graph's container geometry and
# the viewpoint ring's radius.
#
# Offline, against instance ground truth on the test scenes (418 objects),
# against I6r1: association identical in all 15 episodes (purity 0.935,
# extra tracks per object 2.325, both unchanged); IoU 0.388 -> 0.437, centre
# error 0.172 -> 0.135 m (-21.5%); YCB centre 13 -> 27 mm (paired +5 mm,
# p = 0.09, n = 13), YCB IoU 0.517 -> 0.553; 1.47x object-layer time,
# snapshots +72%.
#
# ADOPTED BY DECISION, NOT BY THE PRE-REGISTERED BAR: IoU missed it by 0.001
# (+0.049 against +0.05) and the YCB-centre guardrail is worse at the median
# (not significant). Few-view small objects on a support are reported too
# tall (S82 diagnosis).
#
# Closed loop (seed 42, VLM off, S82): 58 paired episodes, success 36 vs
# I6r1's 35 (4/3, sign p = 1.00); FP commits 39 vs 38 (p = 0.77); best stop
# 0.71 vs 0.68 m (p = 0.77); object layer 1.61x I6r1's time online. No
# navigation gain is claimed. Its prior map is the replay of the pass-1
# recording under these overrides:
#
#   OSG=outputs/maps_v2_osg_R2 bash scripts/run_mfv2.sh osg_vet_live_ellipsoid_v3 <seed>
defaults:
  - mfv2_osg_vet_live_ellipsoid_v2
  - _self_

scene_graph:
  ellipsoid:
    fuse_report: true
