# @package _global_
#
# `mfv2_osg_landing_vet`, and every LIVE target-labelled track judged once by the
# STOP gate's recogniser the first time it is a commit candidate
# (`verification.stop_gate_vet_live`, `StopGate.vet_live`) -- before the
# approach walk, not at the STOP.
#
# What the false commits are (osg_landing, 3 seeds; scratchpad what_is_there.py
# renders HM3D's semantic annotation at each committed centre): toy airplane on
# doors, handrails, stair railings and a wash cabinet; coffee can on walls,
# books and paintings; cracker box on baskets and bottles. Prior vetting, the
# same reading on pass-1 crops, gained 6 and 3 episodes on seeds 42 and 43 as
# an ablation of mouth_walk. Every verdict is logged with its range
# (`agent_stats.live_vet_log`) for the recogniser's accuracy beyond 1.5 m.
#
#   bash scripts/run_mfv2.sh osg_landing_vet_live <seed>
defaults:
  - mfv2_osg_landing_vet
  - _self_

verification:
  stop_gate_vet_live: true
