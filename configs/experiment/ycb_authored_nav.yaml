# @package _global_
#
# Data-driven authored YCB ObjectNav benchmark. Scene and layout selectors are
# ordinary Hydra overrides; no per-scene experiment preset is needed.
#
#   # all complete authored scenes (default)
#   python scripts/run_eval.py +experiment=ycb_authored_nav
#
#   # one scene, or a subset
#   python scripts/run_eval.py +experiment=ycb_authored_nav 'ycb.scenes=[00829-QaLdnwvtxbs]'
#   python scripts/run_eval.py +experiment=ycb_authored_nav 'ycb.scenes=[00829-QaLdnwvtxbs,00900-FutureScene]'
#
#   # one dynamic relocation slot
#   python scripts/run_eval.py +experiment=ycb_authored_nav \
#     'ycb.layout_types=[in_anchor]' 'ycb.layout_indices=[2]'
#
#   # explicit 6 GB fallback (never selected automatically)
#   python scripts/run_eval.py +experiment=ycb_authored_nav detector=yoloe_small
defaults:
  - override /detector: yoloe
  - override /exploration: sweep
  - override /verification: "off"
  - override /eval: ycb_authored

# YCB targets are an order of magnitude smaller than HM3D ObjectNav's furniture,
# and the default gates are tuned for furniture. Measured on 00829-QaLdnwvtxbs:
# a bowl reaches 1759 px at its BEST authored viewpoint, against a 1500 px
# node-creation gate and a 3000 px candidate gate -- so the target was discarded
# on sight and every episode failed for want of a detection, not for want of
# navigation. With these values the same episode succeeds (SPL 0.32) and the
# bowl is mapped 0.03 m from its authored pose.

# Detection for small tabletop objects, measured at each object's best authored
# viewpoint with the pipeline's own vocabulary and exact-label matching:
#
#            imgsz 512   768   960  1280      cost/frame
#   bowl          0.90  0.94  0.95  0.88      512:  34 ms
#   plate         0.43  0.23  0.00  0.14      768:  38 ms
#   soup can      0.31  0.58  0.54  0.63      960:  42 ms
#   cracker box   0.00  0.39  0.50  0.62     1280:  51 ms
#   pitcher       0.00  0.00  0.00  0.00
#   scissors      0.00  0.00  0.00  0.00
#
# At the 512 default only the bowl and (marginally) the plate clear the 0.35
# admission gate; at 1280 the soup can and cracker box join them, for 17 ms per
# keyframe against a ~250 ms control loop. The pitcher renders as an untextured
# dark cylinder with no handle or spout -- a broken asset, not a detection
# problem -- and the scissors are too thin to survive at any resolution.
detector:
  imgsz: 1280
  # The vocabulary is DEFAULT_VOCABULARY plus the episode target, so a mapping
  # run for one target has no class for the others and cannot map them. A
  # multi-target benchmark needs every target present from the start.
  vocabulary: ["chair", "sofa", "armchair", "plant", "bed", "toilet", "tv_monitor", "table", "desk", "cabinet", "shelf", "dresser", "wardrobe", "nightstand", "lamp", "pillow", "cushion", "picture", "mirror", "window", "door", "sink", "bathtub", "shower", "towel", "counter", "stool", "bench", "refrigerator", "oven", "microwave", "washing machine", "stove", "fireplace", "stairs", "rug", "curtain", "clothes", "book", "box", "basket", "banana", "bowl", "cracker box", "mug", "pitcher", "plate", "scissors", "tomato soup can"]

scene_graph:
  min_det_bbox_px: 300

verification:
  min_bbox_px: 300
  min_score: 0.30

agent:
  max_steps: 500
  success_distance: 0.18
  use_habitat_navmesh: true
  # Stop at a view point, not at a depth threshold. Success here is measured
  # from the final pose to the nearest sampled goal viewpoint, and those sit on
  # rings at 0.8/1.2/1.5/2.0 m; closing until the target's depth reaches 1.0 m
  # lands between the two inner rings. Measured before this: four of seven
  # episodes ended at 0.18-0.28 m against a 0.18 m radius, having found the
  # object.
  approach_to_viewpoint: true

eval:
  mode: ycb_authored

ycb:
  data_root: /datasets/habitat-data-collector/data
  layout_root: /datasets/habitat-data-collector/outputs/dualmap_authoring
  scenes: ["*"]
  layout_types: [static]
  layout_indices: [1, 2, 3]
  starts_per_target: 1
  seed: 42
  manifest_cache_dir: outputs/ycb_manifests
