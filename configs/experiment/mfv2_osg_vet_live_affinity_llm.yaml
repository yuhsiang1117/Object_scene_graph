# @package _global_
#
# The final arm (`mfv2_osg_landing_vet_live`) with ONE change: the affinity prior from the LLM for every class, grounded.
# Paired against osg_landing_vet_live_s<seed>; the same ablation on the earlier
# arm is `mfv2_osg_mouth_walk_affinity_llm`.
#
#   bash scripts/run_mfv2.sh osg_vet_live_affinity_llm <seed>
defaults:
  - mfv2_osg_landing_vet_live
  - _self_

exploration:
  affinity_llm: true
  affinity_table: false
  affinity_grounded: true
  affinity_cache: outputs/affinity_cache_llm_only.json
