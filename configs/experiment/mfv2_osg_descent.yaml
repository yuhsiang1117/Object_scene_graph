# @package _global_
#
# `mfv2_osg_creep` with a descending flight pursued to its top
# (`floor.descent_goal: extrapolated`, mapping/stairs.py) rather than to the
# lowest tread seen. `stairs.mouth_xy` read `Flight.foot_xy` as every flight's
# lowest tread while `find_flights` stores a descent's HIGHEST tread there, so
# every arm through 2026-10-17 walked a descending agent toward the far end of
# the staircase, under the storey it was on. Benchmark v2 seed 42 (mfv2_osg_climb):
# 00862's pursuits went to (-0.93, -2.22) and (-0.22, -3.82) for a flight whose
# top is at (-0.69, -1.23), and none of the 9 episodes on 00862 / 00873 that
# had to go down did. From a distance the top treads hide behind the lip, so
# the goal is extrapolated up the flight's own slope to the floor.
#
#   python scripts/run_eval.py +experiment=mfv2_osg_descent ...same inputs as mfv2_osg
defaults:
  - mfv2_osg_creep
  - _self_

floor:
  descent_goal: extrapolated

# On the stairs, plan over what the treads look like from the treads
# (`agent.climb_route_gap_fill_m`, mapping/stair_route.py): the top layer
# where the lowest has no reading, no standing-height paving of FREE cells,
# a bridge over the unseen tread ahead, nothing overhead on a descent, the
# lowest layer recorded while climbing, and arrival judged by the storey's
# own height. Traced from 1 m behind the true lip (scratchpad trace_suite):
# 00862, 00873, 00821 descents 1/3 -> 3/3; the four ascents unchanged.
agent:
  climb_route_gap_fill_m: 0.8
