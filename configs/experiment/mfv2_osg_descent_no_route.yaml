# @package _global_
#
# Ablation of the final arm (`mfv2_osg_descent`): the stair route off: the climb walks the flight blob's carrot (the descent is
# still pursued to its top).
#
#   bash scripts/run_mfv2.sh osg_descent_no_route <seed>
defaults:
  - mfv2_osg_descent
  - _self_

agent:
  climb_route: false
