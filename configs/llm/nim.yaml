defaults:
  - base_ollama

# NVIDIA NIM (build.nvidia.com) — OpenAI-compatible hosted inference.
# Pair with `verification=nim` so the target verifier also uses the hosted
# vision model. Needs NVIDIA_API_KEY in the environment (e.g. from .env).
#
# Note: on the public NIM endpoint the 90B vision model times out; the 11B
# sibling responds in <1s and scored 0.850 on verify_bench (vs local qwen
# 0.750). Vision models mangle their output under response_format=json_object,
# so send_response_format is disabled and JSON is parsed from the text reply.
base_url: https://integrate.api.nvidia.com/v1
api_key: ${oc.env:NVIDIA_API_KEY,missing}
# Text scorer (frontier ranking) = NVIDIA Nemotron Nano 9B v2 (a reasoning
# model; it emits thinking before the JSON, but extract_json recovers it, ~7s/call).
# 2026-09: `nvidia/nvidia-nemotron-nano-9b-v2` reached end of life on
# 2026-08-26 and every call returns HTTP 410. `ascent_ranker` catches that and
# falls back to the value ranking WITHOUT counting it as an LLM error, so the
# frontier ranker has been silently inert in every run since -- s70, s72 and
# s68 all record llm_calls = 0 while their configs claim `ranker: ascent`.
# Successor, checked live against /v1/models and a completion:
text_model: nvidia/nemotron-3.5-lightning-30b-a3b
send_response_format: false
