defaults:
  - base_on

enabled: false

# With no VLM verifier to filter candidates, the candidate quality gates are the
# only thing standing between a detection and a STOP -- but the strict values
# tuned for the verified pipeline (bbox_px=3000, obs=3, evidence=1.0) reject
# small/far objects (plants/sofas/tv seen from a distance) so they never become
# candidates. Loosening these for the no-verification (old-algorithm) pipeline
# lifted single-floor SR 1/15 -> 3/15 (0.200) with only 1 false-positive approach.
min_bbox_px: 1200
min_obs: 2
min_evidence: 0.5
min_score: 0.35
