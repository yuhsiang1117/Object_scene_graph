defaults:
  - base_on

# VLM candidate verifier ON, using the NVIDIA NIM hosted vision model
# (meta/llama-3.2-11b-vision-instruct). It reuses the llm=nim endpoint/key
# (see runner.build_verifier), so pair this with `llm=nim`. On the public NIM
# endpoint this 11B model returns in ~0.7s and scored 0.850 acc / recall 1.000
# on tests/fixtures/verify_bench (vs 0.750 for local qwen2.5vl:7b); the 90B
# sibling times out there. Vision models mangle response_format=json_object,
# so llm=nim already sets send_response_format:false and the JSON is parsed
# from the plain-text reply.
enabled: true
vlm_model: meta/llama-3.2-11b-vision-instruct

# Candidate-admission gates DELIBERATELY held at the same loosened values as
# verification=off (the matched-run baseline), so this run isolates a single
# variable: the VLM gate before STOP. Reverting to the stricter base_on gates
# (bbox_px=3000, obs=3, evidence=1.0) would change candidate recall at the same
# time and confound the A/B. The VLM -- not the gates -- is now the precision
# filter; measure its effect against matched_old with everything else fixed.
min_bbox_px: 1200
min_obs: 2
min_evidence: 0.5
# 0.35 -> 0.70, measured on the 100-episode aligned run (docs/AB_RESULTS S13):
# 30 of 45 failures committed to something, walked to it (median 0.43 m), and it
# was 7.48 m from any real goal. Those commits carried a median detection score
# of 0.698 against 0.853 for successes. Raising the gate took SR 55% -> 58% and
# far-commit failures 30 -> 23.
#
# It lives HERE, not only in VerificationConfig: this file is loaded by every
# run, so the dataclass default is never what executes. A change made only there
# is inert -- which is exactly what happened on the first attempt.
min_score: 0.70
